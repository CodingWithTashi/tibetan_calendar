name: tibetan_calendar
description: Tibetan Calendar package provides easy way to get Tibetan date and year based on Western date. Includes full support for Tibetan date conversion, Losar calculations, Rabjung cycles, and year attributes.
version: 2.0.0
homepage: https://github.com/CodingWithTashi/tibetan_calendar.git
issue_tracker: https://github.com/CodingWithTashi/tibetan_calendar/issues

environment:
  sdk: ">=3.0.0 <4.0.0"

dev_dependencies:
  test: ^1.22.1
